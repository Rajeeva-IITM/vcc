defaults:
  - data: dataset_cp10k
  - model: model
  - trainer: trainer
  - callbacks: defaults
  - paths: defaults
  - logging: wandb
  # - hydra: defaults
  - _self_

seed: 42

predict: false # Save time by not predicting unnecessarily (There's separate script for 2026)

logging:
  wandb:
    job_type: VCC

ckpt_path: null # In case one wants to resume training
# Inductor spawns 32 compile-worker processes at startup; `reduce-overhead`
# (cudagraphs) buys little for a few small MLPs. Turn on only if you need it.
compile: false
