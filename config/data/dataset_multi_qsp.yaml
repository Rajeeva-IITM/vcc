# `dataset_multi`, but the frozen `ko_vec` is the CONCATENATION of THREE blocks:
#   expr_quantiles (256) + STRING network (512) + Poincare-GO (256)  -> 1024-d  ("qsp").
#
# Why these three
# ---------------
# CKA vs the true response (2026-09-08): expr_quantiles 0.108 (carries almost all the
# response-aligned signal), string_network 0.033 (best a-priori interaction-graph block,
# 2.3x Poincare), poincare 0.014 (functional-graph structure). The graph blocks are
# near-ORTHOGONAL to quantiles (string~quant 0.044, poincare~quant 0.012), so each adds
# ~independent structure while quantiles carry the direction.
#
# This concat is the INPUT to a LEARNED metric: pair with
# `model_flow_film_kernel_linhead_qsp` (ko_conditioner.input_size = 1024, proj_dim = 64).
# The KernelFiLM `proj_dim` projection learns which of the 1024 dims predict response
# similarity -- expected to amplify the quantile block and down-weight the graph blocks --
# rather than trusting the raw concat cosine (the fixed-metric ceiling).
#
# Fair combination: `_load_embeddings` L2-normalises EACH block per row before concatenating,
# so the three blocks contribute equally before the learned metric reweights them. Rows align
# on the FIRST path (quantiles, 18,080 genes); a gene a source lacks is zero-filled for that
# block (STRING covers 17,183/18,080 = 95%; quantiles + poincare cover all 18,080).
#
# Frozen only (a `ko_vec` config).
#
# Run: pixi run python src/train.py model=model_flow_film_kernel_linhead_qsp \
#          data=dataset_multi_qsp 'trainer.devices=[1]'
datamodule:
  _target_: src.data.vcc_anndata_module.AnnDataVCCDataModule
  data_path:
    - ${paths.data_dir}/2025/adata_2025_all.h5ad
    - ${paths.data_dir}/primeflow_data/replogle22_k562_preprocessed.h5ad
    - ${paths.data_dir}/primeflow_data/nadig24_jurkat_preprocessed.h5ad
  # A list -> per-block L2-normalise and concatenate. Quantiles FIRST fixes the row order.
  gene_embedding_path:
    - ${paths.data_dir}/gene_embeddings/quantiles-train_expression.parquet
    - ${paths.data_dir}/gene_embeddings/string_network_512.parquet
    - ${paths.data_dir}/gene_embeddings/poincare_go_gaf_logmapped_256.parquet
  pert_counts_path: ${paths.data_dir}/2025/validation/pert_counts_Validation.csv
  gene_list_path: ${paths.data_dir}/2025/gene_names.csv
  cache_dir: ${paths.data_dir}/_cache
  source_weights:
    adata_2025_all: 0.63
    replogle22_k562_preprocessed: 0.30
    nadig24_jurkat_preprocessed: 0.07
  val_source: adata_2025_all
  unobserved_fill: reference_mean
  epoch_size: null
  control_label: non-targeting
  target_sum: 1e4
  log1p: true
  target_mode: perturbation_mean
  seed: ${seed}
  num_workers: 4
  batch_size: 1024
  test_size: 0.2

metadata:
  groupname: VCC
  savename: ${data.metadata.groupname}_${now:%d_%m_%Y}/${now:%H-%M-%S}
